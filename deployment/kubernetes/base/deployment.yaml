apiVersion: apps/v1
kind: Deployment
metadata:
  name: terralegislativepulse
  labels:
    app: terralegislativepulse
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terralegislativepulse
  template:
    metadata:
      labels:
        app: terralegislativepulse
    spec:
      containers:
      - name: terralegislativepulse
        image: terralegislativepulse:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: config-volume
        configMap:
          name: terralegislativepulse-config 