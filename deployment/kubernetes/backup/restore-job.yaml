apiVersion: batch/v1
kind: Job
metadata:
  name: terralegislativepulse-restore
spec:
  template:
    spec:
      containers:
      - name: restore
        image: postgres:13
        command:
        - /bin/sh
        - -c
        - |
          pg_restore -h $DB_HOST -U $DB_USER -d $DB_NAME -c /backup/backup.dump
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: database-host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: database-user
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: database-name
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: terralegislativepulse-secrets
              key: database-password
        volumeMounts:
        - name: backup-volume
          mountPath: /backup
      volumes:
      - name: backup-volume
        persistentVolumeClaim:
          claimName: terralegislativepulse-backup-pvc
      restartPolicy: OnFailure 