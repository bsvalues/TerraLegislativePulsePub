apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: terralegislativepulse-alerts
spec:
  groups:
  - name: terralegislativepulse
    rules:
    - alert: HighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total{container="terralegislativepulse"}[5m])) by (pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High CPU usage detected
        description: "Pod {{ $labels.pod }} has high CPU usage ({{ $value }}%)"

    - alert: HighMemoryUsage
      expr: sum(container_memory_usage_bytes{container="terralegislativepulse"}) by (pod) / sum(container_spec_memory_limit_bytes{container="terralegislativepulse"}) by (pod) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High memory usage detected
        description: "Pod {{ $labels.pod }} has high memory usage ({{ $value }}%)"

    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total{container="terralegislativepulse"}[1h]) > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Pod is crash looping
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

    - alert: HighLatency
      expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="terralegislativepulse"}[5m])) by (le)) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High latency detected
        description: "95th percentile latency is {{ $value }}s"

    - alert: HighErrorRate
      expr: sum(rate(http_requests_total{job="terralegislativepulse",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="terralegislativepulse"}[5m])) * 100 > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: High error rate detected
        description: "Error rate is {{ $value }}%"

    - alert: DatabaseConnectionIssues
      expr: pg_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Database connection issues
        description: "Cannot connect to the database"

    - alert: RedisConnectionIssues
      expr: redis_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Redis connection issues
        description: "Cannot connect to Redis"

    - alert: DiskSpaceLow
      expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100 < 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Low disk space
        description: "Node {{ $labels.node }} has only {{ $value }}% free disk space" 